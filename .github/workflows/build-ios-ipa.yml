name: Build CRUX IPA

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "validation/**"

permissions:
  contents: read

concurrency:
  group: crux-ios-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build unsigned iPhone IPA
    runs-on: macos-15
    timeout-minutes: 90
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
    steps:
      - name: Check out CRUX
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Check Apple tooling
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          pod --version
      - name: Run iPhone Simulator launch stress
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -workspace ios/CRUX.xcworkspace \
            -scheme CRUX \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$PWD/build/simulator" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' \
            build | tee build/xcodebuild-simulator.log

          app_path="$PWD/build/simulator/Build/Products/Release-iphonesimulator/CRUX.app"
          [[ -d "$app_path" ]] || { echo 'Simulator app bundle missing.' >&2; exit 1; }
          [[ -s "$app_path/main.jsbundle" ]] || { echo 'Simulator JavaScript bundle missing.' >&2; exit 1; }

          simulator_udid="$(xcrun simctl list devices available --json | python3 -c 'import json,sys; devices=json.load(sys.stdin)["devices"]; print(next((d["udid"] for group in devices.values() for d in group if d.get("isAvailable") and d["name"].startswith("iPhone")), ""))')"
          [[ -n "$simulator_udid" ]] || { echo 'No available iPhone simulator found.' >&2; exit 1; }
          echo "Using iPhone simulator $simulator_udid"
          xcrun simctl boot "$simulator_udid"
          xcrun simctl bootstatus "$simulator_udid" -b
          xcrun simctl install "$simulator_udid" "$app_path"
          xcrun simctl get_app_container "$simulator_udid" com.joshua.crux app

          for attempt in $(seq 1 10); do
            echo "Launch/relaunch $attempt of 10"
            launch_output="$(xcrun simctl launch --terminate-running-process "$simulator_udid" com.joshua.crux)"
            echo "$launch_output"
            simulator_pid="$(awk '{print $NF}' <<< "$launch_output")"
            [[ "$simulator_pid" =~ ^[0-9]+$ ]] || { echo 'Simulator did not return an app process ID.' >&2; exit 1; }
            sleep 2
            xcrun simctl spawn "$simulator_udid" kill -0 "$simulator_pid"
            xcrun simctl terminate "$simulator_udid" com.joshua.crux
          done
      - name: Build Release app and package IPA
        run: npm run build:ios:ipa
      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: CRUX-iPhone-Unsigned-1.0.1-${{ github.sha }}
          path: |
            build/CRUX_GYM_READY.ipa
            build/CRUX_GYM_READY.ipa.sha256
          if-no-files-found: error
          retention-days: 30
      - name: Upload build log and native dependency lock
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CRUX_BUILD_DIAGNOSTICS
          path: |
            build/xcodebuild-release.log
            ios/Podfile.lock
          if-no-files-found: ignore
          retention-days: 7
